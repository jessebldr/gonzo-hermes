# Hermes CLI config — fork gonzo.
#
# File này ĐƯỢC commit: nó không chứa secret. Key sống ở `.env` (gitignored,
# chmod 600) và được trỏ tới bằng `key_env`. Đúng luật của gonzo/README.md —
# không secret trong repo — và đúng D-19: deploy phải tái tạo được từ git.
#
# ⚠️ Thứ tự đọc config (cli.py:408): `~/.hermes/config.yaml` THẮNG file này,
# và nó THAY THẾ chứ không merge. Giữ cho file đó không tồn tại, nếu không thì
# config trong repo bị vô hiệu một cách âm thầm.
#
# Khuôn `custom_providers` dưới đây lấy từ cấu hình Hermes đang chạy thật trên
# máy (platform/hermes/config.yaml), đổi `host.docker.internal` → `localhost`
# vì bản này chạy trên host, không trong container.

# Model: ag/gemini-3.6-flash-high. Các con số dưới đây KHÔNG phải phỏng đoán —
# lấy từ `GET /v1/models` của chính 9router: contextWindow 1048576, maxOutput 65536,
# tools true (Hermes bắt buộc có), reasoning true với thinkingCanDisable false.
model:
  provider: custom:9router
  default: ag/gemini-3.6-flash-high
  base_url: http://localhost:20128/v1
  context_length: 1048576

custom_providers:
  - name: 9router
    base_url: http://localhost:20128/v1
    key_env: GONZO_9ROUTER_KEY
    api_mode: chat_completions
    models:
      ag/gemini-3.6-flash-high:
        context_length: 1048576

# Narrow company-vault surface. Hermes spawns this host-side stdio child itself: no TCP
# listener, no bearer token, no raw filesystem/index tools. apply-config.sh renders the
# three path placeholders and installs the tracked launcher under HERMES_HOME/bin.
mcp_servers:
  gonzo_vault:
    command: "__HERMES_HOME__/bin/gonzo-vault-policy-mcp"
    args:
      - "__GONZO_HERMES_ROOT__/gonzo/vault_policy/server.py"
      - "--vault"
      - "__GONZO_VAULT_ROOT__"
      - "--state-dir"
      - "__HERMES_HOME__/vault-policy"
      - "--model-cache"
      - "__HERMES_HOME__/cache/vault-policy-model"
    enabled: true
    timeout: 180
    connect_timeout: 180
    supports_parallel_tool_calls: false
    tools:
      include: [vault_query]
      resources: false
      prompts: false

# Agent core và Lark gateway chạy trên host, nhưng mọi file/terminal/execute-code tool
# chạy trong Docker không có host mount. Raw gonzo-vault tuyệt đối không được thêm vào
# docker_volumes; đường duy nhất tới company truth sau này là vault-policy service/MCP.
terminal:
  backend: docker
  cwd: /workspace
  docker_image: python:3.11-slim
  docker_mount_cwd_to_workspace: false
  docker_volumes: []
  docker_forward_env: []
  docker_env: {}
  docker_network: false
  container_persistent: false
  docker_persist_across_processes: false
  docker_orphan_reaper: true
  container_cpu: 1
  container_memory: 512
  container_disk: 0

# Một topic hoặc một group = MỘT session dùng chung (ADR 0002, quyết định 3).
# `thread_sessions_per_user` vốn đã mặc định false; `group_sessions_per_user`
# mặc định true nên phải lật — nếu không, nhắn trong group ngoài topic sẽ đẻ
# một session riêng cho mỗi người.
platforms:
  feishu:
    extra:
      group_sessions_per_user: false
      thread_sessions_per_user: false
